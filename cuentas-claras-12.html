<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#6366f1"/>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Cuentas Claras&quot;,&quot;short_name&quot;:&quot;Cuentas&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;background_color&quot;:&quot;%23f8fafc&quot;,&quot;theme_color&quot;:&quot;%236366f1&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>&quot;,&quot;sizes&quot;:&quot;any&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}"/>
<title>💸 Cuentas Claras</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#f8fafc;font-family:'DM Sans',system-ui,sans-serif;overscroll-behavior:none}
  input,select,textarea,button{font-family:inherit}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

// ── STORAGE ──────────────────────────────────────────────────────────────────
const save = (key, val) => { try { localStorage.setItem("cc_"+key, JSON.stringify(val)); } catch(e){} };
const load = (key, fallback) => { try { const v=localStorage.getItem("cc_"+key); return v?JSON.parse(v):fallback; } catch(e){ return fallback; } };

// ── FAKE DATA ────────────────────────────────────────────────────────────────
const makeFake = () => {
  const cats=["Supermercado","Restaurante","Servicios","Nafta","Farmacia","Ropa","Entretenimiento","Vacaciones","Médico","Otros"];
  const descs={Supermercado:["Carrefour","Coto","Día","Jumbo","Walmart"],Restaurante:["Almuerzo centro","Cena romántica","Sushi","Pizza","Brunch"],Servicios:["Luz","Gas","Internet","Expensas","Seguro"],Nafta:["YPF","Shell","Axion","BP"],Farmacia:["Farmacity","Medicamentos","Vitaminas","Ibuprofeno"],Ropa:["Zara","H&M","Adidas","Nike","Ropa interior"],Entretenimiento:["Netflix","Spotify","Cine","Teatro","Concierto"],Vacaciones:["Hotel MdP","Vuelo Mendoza","Airbnb Bariloche","Excursión","Tour"],Médico:["Clínica","Dentista","Análisis","Kinesiólogo"],Otros:["Regalo","Librería","Ferretería","Flores","Taxi"]};
  const rng=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
  const txs=[]; let id=1;
  let d=new Date("2024-11-01"); const end=new Date("2026-05-22");
  while(d<=end){
    for(let i=0;i<rng(2,4);i++){
      const cat=pick(cats);
      txs.push({id:id++,date:d.toISOString().split("T")[0],description:pick(descs[cat]),category:cat,amount:rng(500,18000),paidBy:Math.random()<0.52?"fede":"gaby",type:Math.random()<0.25?"pot":"individual",edited:false});
    }
    d.setDate(d.getDate()+rng(1,3));
  }
  const contribs=[
    {id:1,date:"2024-11-10",who:"fede",amount:30000},{id:2,date:"2024-11-10",who:"gaby",amount:30000},
    {id:3,date:"2024-12-01",who:"fede",amount:25000},{id:4,date:"2024-12-15",who:"gaby",amount:20000},
    {id:5,date:"2025-01-05",who:"fede",amount:35000},{id:6,date:"2025-01-05",who:"gaby",amount:35000},
    {id:7,date:"2025-02-10",who:"fede",amount:40000},{id:8,date:"2025-02-10",who:"gaby",amount:40000},
    {id:9,date:"2025-03-01",who:"fede",amount:50000},{id:10,date:"2025-04-01",who:"gaby",amount:45000},
    {id:11,date:"2025-04-01",who:"fede",amount:45000},{id:12,date:"2025-05-01",who:"fede",amount:60000},
    {id:13,date:"2025-05-01",who:"gaby",amount:55000},{id:14,date:"2025-06-15",who:"fede",amount:70000},
    {id:15,date:"2025-07-01",who:"gaby",amount:65000},{id:16,date:"2025-08-01",who:"fede",amount:80000},
    {id:17,date:"2025-08-01",who:"gaby",amount:80000},{id:18,date:"2025-09-10",who:"fede",amount:90000},
    {id:19,date:"2025-10-01",who:"gaby",amount:85000},{id:20,date:"2025-11-01",who:"fede",amount:100000},
    {id:21,date:"2025-11-01",who:"gaby",amount:100000},{id:22,date:"2026-01-05",who:"fede",amount:120000},
    {id:23,date:"2026-01-05",who:"gaby",amount:110000},{id:24,date:"2026-03-01",who:"fede",amount:130000},
    {id:25,date:"2026-03-01",who:"gaby",amount:125000},
  ];
  const loans=[
    {id:1,date:"2024-12-20",from:"fede",to:"gaby",amount:15000,description:"Regalo mamá"},
    {id:2,date:"2025-02-14",from:"gaby",to:"fede",amount:8000,description:"Farmacia emergencia"},
    {id:3,date:"2025-04-05",from:"fede",to:"gaby",amount:22000,description:"Ropa temporada"},
    {id:4,date:"2025-07-10",from:"gaby",to:"fede",amount:35000,description:"Viaje Mendoza"},
    {id:5,date:"2025-11-20",from:"fede",to:"gaby",amount:12000,description:"Médico urgente"},
    {id:6,date:"2026-02-08",from:"gaby",to:"fede",amount:18000,description:"Cena aniversario"},
  ];
  return {txs,contribs,loans};
};

// ── HELPERS ──────────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);
const fmtD = s => new Date(s+"T12:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"});
const today = () => new Date().toISOString().split("T")[0];
const inp = {border:"1.5px solid #e2e8f0",borderRadius:10,padding:"10px 11px",fontSize:14,outline:"none",background:"#f8fafc",width:"100%",boxSizing:"border-box"};
const sel = {border:"1.5px solid #e2e8f0",borderRadius:10,padding:"10px 11px",fontSize:14,background:"#f8fafc",width:"100%",boxSizing:"border-box"};
const chip = {padding:"6px 13px",borderRadius:99,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer",fontSize:12,fontWeight:600,color:"#64748b"};
const chipA = {background:"#6366f1",color:"white",border:"1.5px solid #6366f1"};
const btnP = {background:"#6366f1",color:"white",border:"none",borderRadius:10,padding:12,fontWeight:700,cursor:"pointer",fontSize:14,flex:1};
const btnS = {background:"#f1f5f9",color:"#64748b",border:"none",borderRadius:10,padding:12,fontWeight:700,cursor:"pointer",fontSize:14,flex:1};

function Row({children}){return <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>{children}</div>;}
function H2({children}){return <h2 style={{fontSize:19,fontWeight:800,color:"#1e293b",margin:0}}>{children}</h2>;}
function Card({children}){return <div style={{background:"white",borderRadius:16,padding:14,marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,.07)",display:"flex",flexDirection:"column",gap:9}}>{children}</div>;}
function Btn({children,onClick,color}){return <button onClick={onClick} style={{background:color||"#6366f1",color:"white",border:"none",borderRadius:99,padding:"8px 16px",fontWeight:700,cursor:"pointer",fontSize:13}}>{children}</button>;}

function Toggle({v,onChange,opts}){
  return <div style={{display:"flex",gap:7}}>{opts.map(o=>(
    <button key={o.v} onClick={()=>onChange(o.v)} style={{flex:1,padding:"9px 6px",borderRadius:10,border:v===o.v?"2px solid #6366f1":"2px solid #e2e8f0",background:v===o.v?"#ede9fe":"white",color:v===o.v?"#6366f1":"#64748b",cursor:"pointer",fontSize:13,fontWeight:600}}>{o.l}</button>
  ))}</div>;
}

function Modal({children,onClose}){
  return <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"white",borderRadius:"22px 22px 0 0",padding:22,width:"100%",maxWidth:520,maxHeight:"85vh",overflowY:"auto",display:"flex",flexDirection:"column",gap:9}}>
      {children}
    </div>
  </div>;
}

// ── APP ROOT ─────────────────────────────────────────────────────────────────
function App(){
  // Limpiar cualquier dato viejo al arrancar
  useEffect(()=>{
    const cleaned = load("cleaned_v2", false);
    if(!cleaned){
      ["txs","contribs","loans","adjs","hist"].forEach(k=>localStorage.removeItem("cc_"+k));
      save("cleaned_v2", true);
    }
  },[]);

  const [user,  setUser]  = useState(() => load("user",  null));
  const [txs,   setTxs]   = useState(() => load("txs",   []));
  const [contribs,setContribs] = useState(() => load("contribs", []));
  const [loans, setLoans] = useState(() => load("loans", []));
  const [adjs,  setAdjs]  = useState(() => load("adjs",  []));
  const [hist,  setHist]  = useState(() => load("hist",  []));

  const upd = (setter, key) => val => { setter(val); save(key, val); };
  const updTxs     = upd(setTxs,      "txs");
  const updContribs= upd(setContribs, "contribs");
  const updLoans   = upd(setLoans,    "loans");
  const updAdjs    = upd(setAdjs,     "adjs");
  const updHist    = upd(setHist,     "hist");

  const selectUser = u => { setUser(u); save("user", u); };

  if(!user) return <UserSelect onSelect={selectUser}/>;
  return <Main user={user} onSwitch={()=>selectUser(null)}
    txs={txs} updTxs={updTxs}
    contribs={contribs} updContribs={updContribs}
    loans={loans} updLoans={updLoans}
    adjs={adjs} updAdjs={updAdjs}
    hist={hist} updHist={updHist}
  />;
}

// ── USER SELECT ──────────────────────────────────────────────────────────────
function UserSelect({onSelect}){
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#667eea,#764ba2)"}}>
    <div style={{background:"white",borderRadius:24,padding:"40px 32px",textAlign:"center",boxShadow:"0 25px 50px rgba(0,0,0,0.25)",minWidth:300}}>
      <div style={{fontSize:28,fontWeight:800,color:"#1e293b",marginBottom:8}}>💸 Cuentas Claras</div>
      <div style={{fontSize:16,color:"#64748b",marginBottom:32}}>¿Quién sos?</div>
      <div style={{display:"flex",gap:16,justifyContent:"center"}}>
        <button onClick={()=>onSelect("fede")} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,padding:"20px 28px",borderRadius:16,border:"none",cursor:"pointer",background:"#ede9fe",color:"#6d28d9",fontSize:18,fontWeight:700}}>
          <span style={{fontSize:40}}>🧔</span>Fede
        </button>
        <button onClick={()=>onSelect("gaby")} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,padding:"20px 28px",borderRadius:16,border:"none",cursor:"pointer",background:"#fce7f3",color:"#be185d",fontSize:18,fontWeight:700}}>
          <span style={{fontSize:40}}>👩</span>Gaby
        </button>
      </div>
      <button onClick={()=>{if(window.confirm("¿Borrar todos los datos y empezar de cero?")){"txs,contribs,loans,adjs,hist,user".split(",").forEach(k=>localStorage.removeItem("cc_"+k));window.location.reload();}}} style={{marginTop:24,background:"none",border:"1.5px solid #e2e8f0",borderRadius:99,padding:"8px 18px",fontSize:12,color:"#94a3b8",cursor:"pointer"}}>
        🔄 Resetear todos los datos
      </button>
    </div>
  </div>;
}

// ── MAIN ─────────────────────────────────────────────────────────────────────
function Main({user,onSwitch,txs,updTxs,contribs,updContribs,loans,updLoans,adjs,updAdjs,hist,updHist}){
  const [tab,setTab]=useState("gastos");

  const calcBal=()=>{
    let g2f=0,f2g=0;
    txs.filter(t=>t.type==="individual").forEach(t=>{const h=t.amount/2; if(t.paidBy==="fede")g2f+=h; else f2g+=h;});
    const fp=contribs.filter(c=>c.who==="fede").reduce((a,c)=>a+c.amount,0);
    const gp=contribs.filter(c=>c.who==="gaby").reduce((a,c)=>a+c.amount,0);
    const diff=fp-gp; if(diff>0)g2f+=diff/2; else if(diff<0)f2g+=Math.abs(diff)/2;
    loans.forEach(l=>{if(l.from==="fede")g2f+=l.amount; else f2g+=l.amount;});
    return{net:g2f-f2g,g2f,f2g};
  };
  const calcPot=()=>contribs.reduce((a,c)=>a+c.amount,0)-txs.filter(t=>t.type==="pot").reduce((a,t)=>a+t.amount,0)+adjs.reduce((a,x)=>a+x.delta,0);

  const {net,g2f,f2g}=calcBal();
  const potBalance=calcPot();
  const tabs=[{id:"gastos",icon:"💳",label:"Gastos"},{id:"pozo",icon:"🪣",label:"Pozo"},{id:"prestamos",icon:"🤝",label:"Préstamos"},{id:"resumen",icon:"📊",label:"Resumen"},{id:"historial",icon:"📜",label:"Historial"}];

  return <div style={{maxWidth:520,margin:"0 auto",minHeight:"100vh",background:"#f8fafc",paddingBottom:80}}>
    <div style={{background:"white",padding:"14px 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #f1f5f9",position:"sticky",top:0,zIndex:10,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
      <div>
        <div style={{fontSize:17,fontWeight:800,color:"#1e293b"}}>💸 Cuentas Claras</div>
        <div onClick={onSwitch} style={{fontSize:12,color:"#6366f1",cursor:"pointer",background:"#ede9fe",padding:"2px 10px",borderRadius:99,display:"inline-block",marginTop:2}}>
          {user==="fede"?"🧔 Fede":"👩 Gaby"} ↩
        </div>
      </div>
      <div style={{fontSize:11,fontWeight:700,color:"white",padding:"6px 10px",borderRadius:99,background:net===0?"#22c55e":net>0?"#f59e0b":"#6366f1",textAlign:"center",lineHeight:1.4}}>
        {net===0?"🤝 Par":net>0?`Gaby debe\n${fmt(Math.abs(net))}`:`Fede debe\n${fmt(Math.abs(net))}`}
      </div>
    </div>
    <div style={{display:"flex",background:"white",borderBottom:"1px solid #f1f5f9",position:"sticky",top:58,zIndex:9,overflowX:"auto"}}>
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"9px 4px",border:"none",background:"transparent",cursor:"pointer",fontSize:17,color:tab===t.id?"#6366f1":"#94a3b8",borderBottom:tab===t.id?"2px solid #6366f1":"2px solid transparent",minWidth:56}}>
          <span>{t.icon}</span><span style={{fontSize:9,fontWeight:700}}>{t.label}</span>
        </button>
      ))}
    </div>
    <div style={{padding:"14px 14px 0"}}>
      {tab==="gastos"    && <GastosTab    user={user} txs={txs} updTxs={updTxs} hist={hist} updHist={updHist}/>}
      {tab==="pozo"      && <PozoTab      user={user} contribs={contribs} updContribs={updContribs} txs={txs} adjs={adjs} updAdjs={updAdjs} hist={hist} updHist={updHist}/>}
      {tab==="prestamos" && <PrestamosTab user={user} loans={loans} updLoans={updLoans}/>}
      {tab==="resumen"   && <ResumenTab   txs={txs} contribs={contribs} loans={loans} adjs={adjs} net={net} g2f={g2f} f2g={f2g} potBalance={potBalance}/>}
      {tab==="historial" && <HistorialTab hist={hist} updHist={updHist}/>}
    </div>
  </div>;
}

// ── GASTOS ───────────────────────────────────────────────────────────────────
function GastosTab({user,txs,updTxs,hist,updHist}){
  const [open,setOpen]=useState(false);
  const [filter,setFilter]=useState("all");
  const [editTx,setEditTx]=useState(null);
  const [editReason,setEditReason]=useState("");
  const [selectMode,setSelectMode]=useState(false);
  const [selected,setSelected]=useState(new Set());
  const [confirmAll,setConfirmAll]=useState(false);
  const cats=["Supermercado","Restaurante","Servicios","Nafta","Farmacia","Ropa","Entretenimiento","Vacaciones","Médico","Otros"];
  const blank={description:"",amount:"",category:"Supermercado",paidBy:user,type:"pot",date:today()};
  const [form,setForm]=useState(blank);

  const add=()=>{
    if(!form.description.trim()||!form.amount)return;
    updTxs([{...form,id:Date.now(),amount:Number(form.amount),edited:false},...txs]);
    setForm(blank); setOpen(false);
  };

  const confirmEdit=()=>{
    if(!editReason.trim()){alert("Ingresá el motivo");return;}
    const old=txs.find(t=>t.id===editTx.id);
    updTxs(txs.map(t=>t.id===editTx.id?{...editTx,amount:Number(editTx.amount),edited:true}:t));
    updHist([...hist,{id:Date.now(),date:today(),who:user,label:"A.D.R.",desc:old.description,oldVal:old.amount,newVal:Number(editTx.amount),reason:editReason}]);
    setEditTx(null);
  };

  const toggleSel=id=>{
    setSelected(prev=>{const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;});
  };

  const deleteSelected=()=>{
    if(!window.confirm(`¿Borrar ${selected.size} gasto${selected.size>1?"s":""}?`))return;
    updTxs(txs.filter(t=>!selected.has(t.id)));
    setSelected(new Set()); setSelectMode(false);
  };

  const deleteAll=()=>{
    updTxs([]); setConfirmAll(false); setSelectMode(false); setSelected(new Set());
  };

  const shown=txs.filter(t=>filter==="all"||t.paidBy===filter).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
      <H2>Gastos</H2>
      <div style={{display:"flex",gap:6}}>
        <Btn onClick={()=>setOpen(o=>!o)}>+ Nuevo</Btn>
        {txs.length>0&&<>
          <button onClick={()=>{setSelectMode(s=>!s);setSelected(new Set());}} style={{fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:99,border:"1.5px solid #e2e8f0",background:selectMode?"#ede9fe":"white",color:selectMode?"#6366f1":"#64748b",cursor:"pointer"}}>
            {selectMode?"Cancelar":"Selec."}
          </button>
          <button onClick={()=>setConfirmAll(true)} style={{fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:99,border:"1.5px solid #fee2e2",background:"#fff1f2",color:"#ef4444",cursor:"pointer"}}>🗑</button>
        </>}
      </div>
    </div>

    {open&&<Card>
      <input style={inp} placeholder="Descripción *" value={form.description} onChange={e=>setForm(p=>({...p,description:e.target.value}))}/>
      <div style={{display:"flex",gap:8}}>
        <input style={inp} type="number" placeholder="Monto $" value={form.amount} onChange={e=>setForm(p=>({...p,amount:e.target.value}))}/>
        <input style={{...inp,width:130}} type="date" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))}/>
      </div>
      <select style={sel} value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))}>
        {cats.map(c=><option key={c}>{c}</option>)}
      </select>
      <select style={sel} value={form.paidBy} onChange={e=>setForm(p=>({...p,paidBy:e.target.value}))}>
        <option value="fede">🧔 Fede pagó</option><option value="gaby">👩 Gaby pagó</option>
      </select>
      <Toggle v={form.type} onChange={v=>setForm(p=>({...p,type:v}))} opts={[{v:"pot",l:"🪣 Del Pozo"},{v:"individual",l:"🤝 Compartido"}]}/>
      <div style={{display:"flex",gap:8}}>
        <button style={btnP} onClick={add}>Guardar</button>
        <button style={btnS} onClick={()=>setOpen(false)}>Cancelar</button>
      </div>
    </Card>}

    {selectMode&&selected.size>0&&
      <div style={{background:"#fef3c7",borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:13,color:"#92400e",fontWeight:600}}>{selected.size} seleccionado{selected.size>1?"s":""}</span>
        <button onClick={deleteSelected} style={{background:"#ef4444",color:"white",border:"none",borderRadius:8,padding:"7px 14px",fontWeight:700,cursor:"pointer",fontSize:13}}>🗑 Borrar</button>
      </div>
    }

    <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
      {[["all","Todos"],["fede","🧔 Fede"],["gaby","👩 Gaby"]].map(([v,l])=>(
        <button key={v} onClick={()=>setFilter(v)} style={{...chip,...(filter===v?chipA:{})}}>{l}</button>
      ))}
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {shown.map(tx=>{
        const isSel=selected.has(tx.id);
        return <div key={tx.id}
          onClick={selectMode?()=>toggleSel(tx.id):undefined}
          style={{background:isSel?"#ede9fe":"white",borderRadius:12,padding:"11px 13px",display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 1px 3px rgba(0,0,0,.06)",cursor:selectMode?"pointer":"default",borderLeft:isSel?"3px solid #6366f1":"3px solid transparent"}}>
          <div style={{flex:1,minWidth:0}}>
            {selectMode&&<div style={{fontSize:11,color:isSel?"#6366f1":"#94a3b8",fontWeight:700,marginBottom:3}}>{isSel?"✅ Seleccionado":"○ Tocar para seleccionar"}</div>}
            <div style={{fontSize:13,fontWeight:600,color:"#1e293b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              {tx.description} {tx.edited&&<span style={{background:"#fef3c7",color:"#92400e",fontSize:10,fontWeight:700,padding:"1px 5px",borderRadius:99}}>A.D.R.</span>}
            </div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{fmtD(tx.date)} · {tx.category} · {tx.paidBy==="fede"?"🧔":"👩"} · {tx.type==="pot"?"🪣":"🤝"}</div>
          </div>
          {!selectMode&&<div style={{display:"flex",alignItems:"center",gap:6,marginLeft:8}}>
            <div style={{fontSize:14,fontWeight:800,color:"#1e293b",whiteSpace:"nowrap"}}>{fmt(tx.amount)}</div>
            <button onClick={()=>{setEditTx({...tx});setEditReason("");}} style={{background:"#ede9fe",color:"#6366f1",border:"none",borderRadius:6,padding:"2px 5px",fontSize:10,cursor:"pointer",fontWeight:700}}>✏️</button>
            <button onClick={()=>{if(window.confirm("¿Borrar este gasto?"))updTxs(txs.filter(t=>t.id!==tx.id));}} style={{background:"#fee2e2",color:"#ef4444",border:"none",borderRadius:6,padding:"2px 5px",fontSize:10,cursor:"pointer",fontWeight:700}}>🗑</button>
          </div>}
          {selectMode&&<div style={{marginLeft:8,fontSize:20}}>{isSel?"✅":"○"}</div>}
        </div>;
      })}
    </div>

    {editTx&&<Modal onClose={()=>setEditTx(null)}>
      <h3 style={{fontSize:17,fontWeight:800,margin:"0 0 8px",color:"#1e293b"}}>✏️ Editar Gasto</h3>
      <div style={{background:"#fef3c7",borderRadius:10,padding:"10px 12px",fontSize:13,color:"#92400e"}}>Quedará como <strong>A.D.R.</strong> (Ajuste por Disidencias con la Realidad)</div>
      <input style={inp} placeholder="Descripción" value={editTx.description} onChange={e=>setEditTx(p=>({...p,description:e.target.value}))}/>
      <input style={inp} type="number" placeholder="Monto" value={editTx.amount} onChange={e=>setEditTx(p=>({...p,amount:e.target.value}))}/>
      <select style={sel} value={editTx.category} onChange={e=>setEditTx(p=>({...p,category:e.target.value}))}>
        {cats.map(c=><option key={c}>{c}</option>)}
      </select>
      <textarea style={{...inp,height:68,resize:"none"}} placeholder="Motivo del ajuste *" value={editReason} onChange={e=>setEditReason(e.target.value)}/>
      <div style={{display:"flex",gap:8}}>
        <button style={btnP} onClick={confirmEdit}>Confirmar A.D.R.</button>
        <button style={btnS} onClick={()=>setEditTx(null)}>Cancelar</button>
      </div>
    </Modal>}

    {confirmAll&&<Modal onClose={()=>setConfirmAll(false)}>
      <h3 style={{fontSize:17,fontWeight:800,margin:"0 0 8px",color:"#1e293b"}}>🗑 Borrar todos los gastos</h3>
      <div style={{background:"#fee2e2",borderRadius:10,padding:"10px 13px",fontSize:13,color:"#b91c1c"}}>
        Esto borra <strong>todos los {txs.length} gastos</strong> permanentemente. No se puede deshacer.
      </div>
      <div style={{display:"flex",gap:8,marginTop:4}}>
        <button style={{...btnP,background:"#ef4444"}} onClick={deleteAll}>Sí, borrar todo</button>
        <button style={btnS} onClick={()=>setConfirmAll(false)}>Cancelar</button>
      </div>
    </Modal>}
  </div>;
}

// ── POZO ─────────────────────────────────────────────────────────────────────
function PozoTab({user,contribs,updContribs,txs,adjs,updAdjs,hist,updHist}){
  const [open,setOpen]=useState(false);
  const [adjOpen,setAdjOpen]=useState(false);
  const [amount,setAmount]=useState("");
  const [who,setWho]=useState(user);
  const [date,setDate]=useState(today());
  const [adjReal,setAdjReal]=useState("");
  const [adjReason,setAdjReason]=useState("");
  const [selContribs,setSelContribs]=useState(false);
  const [selCSet,setSelCSet]=useState(new Set());
  const [editContrib,setEditContrib]=useState(null);

  const potBal=contribs.reduce((a,c)=>a+c.amount,0)-txs.filter(t=>t.type==="pot").reduce((a,t)=>a+t.amount,0)+adjs.reduce((a,x)=>a+x.delta,0);
  const fedePot=contribs.filter(c=>c.who==="fede").reduce((a,c)=>a+c.amount,0);
  const gabyPot=contribs.filter(c=>c.who==="gaby").reduce((a,c)=>a+c.amount,0);

  const addContrib=()=>{
    const n=Number(amount);
    if(!n||n<=0){alert("Ingresá un monto válido");return;}
    updContribs([...contribs,{id:Date.now(),date,who,amount:n}]);
    setAmount(""); setDate(today()); setWho(user); setOpen(false);
  };

  const doAdj=()=>{
    const n=Number(adjReal);
    if(!n||!adjReason.trim()){alert("Completá todos los campos");return;}
    const delta=n-potBal;
    updAdjs([...adjs,{id:Date.now(),date:today(),who:user,delta,oldBal:potBal,newBal:n,reason:adjReason}]);
    updHist([...hist,{id:Date.now(),date:today(),who:user,label:"A.D.R. Pozo",desc:"Ajuste de saldo del pozo",oldVal:potBal,newVal:n,reason:adjReason}]);
    setAdjReal(""); setAdjReason(""); setAdjOpen(false);
  };

  const potTxs=txs.filter(t=>t.type==="pot").sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);

  return <div>
    <Row><H2>🪣 Pozo</H2><Btn onClick={()=>setOpen(o=>!o)}>+ Aporte</Btn></Row>
    <div style={{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",borderRadius:20,padding:20,marginBottom:14,textAlign:"center",color:"white"}}>
      <div style={{fontSize:13,opacity:.85,marginBottom:6}}>Saldo actual del pozo</div>
      <div style={{fontSize:34,fontWeight:900,marginBottom:12}}>{fmt(potBal)}</div>
      <button onClick={()=>setAdjOpen(true)} style={{background:"rgba(255,255,255,.2)",color:"white",border:"1.5px solid rgba(255,255,255,.4)",borderRadius:99,padding:"8px 16px",fontWeight:700,cursor:"pointer",fontSize:13}}>
        ⚡ A.D.R. — Ajustar saldo real
      </button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
      {[["fede","🧔 Fede",fedePot],["gaby","👩 Gaby",gabyPot]].map(([k,name,amt])=>(
        <div key={k} style={{background:"white",borderRadius:14,padding:14,textAlign:"center",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
          <div style={{fontSize:13,fontWeight:700,color:"#475569",marginBottom:6}}>{name}</div>
          <div style={{fontSize:20,fontWeight:900,color:"#1e293b"}}>{fmt(amt)}</div>
          <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>aportado total</div>
        </div>
      ))}
    </div>
    {Math.abs(fedePot-gabyPot)>0&&<div style={{background:"#fef3c7",borderRadius:10,padding:"10px 13px",fontSize:13,color:"#92400e",fontWeight:600,marginBottom:12}}>
      {fedePot>gabyPot?`Gaby le debe a Fede ${fmt((fedePot-gabyPot)/2)} por diferencia de aportes`:`Fede le debe a Gaby ${fmt((gabyPot-fedePot)/2)} por diferencia de aportes`}
    </div>}
    {open&&<Card>
      <div style={{fontWeight:700,color:"#475569"}}>Nuevo aporte al pozo</div>
      <div style={{display:"flex",gap:8}}>
        <input style={inp} type="number" placeholder="Monto $" value={amount} onChange={e=>setAmount(e.target.value)}/>
        <input style={{...inp,width:130}} type="date" value={date} onChange={e=>setDate(e.target.value)}/>
      </div>
      <Toggle v={who} onChange={setWho} opts={[{v:"fede",l:"🧔 Fede"},{v:"gaby",l:"👩 Gaby"}]}/>
      <div style={{display:"flex",gap:8}}>
        <button style={btnP} onClick={addContrib}>Guardar</button>
        <button style={btnS} onClick={()=>setOpen(false)}>Cancelar</button>
      </div>
    </Card>}
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",margin:"16px 0 8px"}}>
      <h3 style={{fontSize:15,fontWeight:700,color:"#475569",margin:0}}>Aportes recientes</h3>
      {contribs.length>0&&<div style={{display:"flex",gap:6}}>
        <button onClick={()=>{setSelContribs(s=>!s);setSelCSet(new Set());}} style={{fontSize:11,fontWeight:700,padding:"5px 10px",borderRadius:99,border:"1.5px solid #e2e8f0",background:selContribs?"#ede9fe":"white",color:selContribs?"#6366f1":"#64748b",cursor:"pointer"}}>{selContribs?"Cancelar":"Selec."}</button>
        <button onClick={()=>{if(window.confirm(`¿Borrar todos los ${contribs.length} aportes?`))updContribs([]);}} style={{fontSize:11,fontWeight:700,padding:"5px 10px",borderRadius:99,border:"1.5px solid #fee2e2",background:"#fff1f2",color:"#ef4444",cursor:"pointer"}}>🗑 Todo</button>
      </div>}
    </div>
    {selContribs&&selCSet.size>0&&<div style={{background:"#fef3c7",borderRadius:10,padding:"9px 13px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <span style={{fontSize:13,color:"#92400e",fontWeight:600}}>{selCSet.size} seleccionado{selCSet.size>1?"s":""}</span>
      <button onClick={()=>{if(window.confirm(`¿Borrar ${selCSet.size} aporte${selCSet.size>1?"s":""}?`)){updContribs(contribs.filter(c=>!selCSet.has(c.id)));setSelCSet(new Set());setSelContribs(false);}}} style={{background:"#ef4444",color:"white",border:"none",borderRadius:8,padding:"6px 13px",fontWeight:700,cursor:"pointer",fontSize:12}}>🗑 Borrar</button>
    </div>}
    <div style={{display:"flex",flexDirection:"column",gap:7}}>
      {[...contribs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(c=>{
        const isSel=selCSet.has(c.id);
        return <div key={c.id} onClick={selContribs?()=>{setSelCSet(prev=>{const n=new Set(prev);n.has(c.id)?n.delete(c.id):n.add(c.id);return n;});}:undefined} style={{background:isSel?"#ede9fe":"white",borderRadius:11,padding:"10px 13px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 3px rgba(0,0,0,.05)",cursor:selContribs?"pointer":"default",borderLeft:isSel?"3px solid #6366f1":"3px solid transparent"}}>
          <div>
            {selContribs&&<div style={{fontSize:11,color:isSel?"#6366f1":"#94a3b8",fontWeight:700,marginBottom:2}}>{isSel?"✅":"○"}</div>}
            <div style={{fontSize:13,fontWeight:600,color:"#1e293b"}}>{c.who==="fede"?"🧔 Fede":"👩 Gaby"} aportó al pozo</div>
            <div style={{fontSize:11,color:"#94a3b8"}}>{fmtD(c.date)}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{fontSize:14,fontWeight:800,color:"#22c55e"}}>+{fmt(c.amount)}</div>
            {!selContribs&&<button onClick={()=>setEditContrib({...c})} style={{background:"#ede9fe",color:"#6366f1",border:"none",borderRadius:6,padding:"2px 5px",fontSize:10,cursor:"pointer",fontWeight:700}}>✏️</button>}
            {!selContribs&&<button onClick={()=>{if(window.confirm("¿Borrar este aporte?"))updContribs(contribs.filter(x=>x.id!==c.id));}} style={{background:"#fee2e2",color:"#ef4444",border:"none",borderRadius:6,padding:"2px 5px",fontSize:10,cursor:"pointer",fontWeight:700}}>🗑</button>}
          </div>
        </div>;
      })}
    </div>
    <h3 style={{fontSize:15,fontWeight:700,color:"#475569",margin:"16px 0 8px"}}>Últimos gastos del pozo</h3>
    <div style={{display:"flex",flexDirection:"column",gap:7}}>
      {potTxs.map(tx=>(
        <div key={tx.id} style={{background:"white",borderRadius:11,padding:"10px 13px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:"#1e293b"}}>{tx.description}</div>
            <div style={{fontSize:11,color:"#94a3b8"}}>{fmtD(tx.date)} · {tx.category}</div>
          </div>
          <div style={{fontSize:14,fontWeight:800,color:"#ef4444"}}>-{fmt(tx.amount)}</div>
        </div>
      ))}
    </div>
    {editContrib&&<Modal onClose={()=>setEditContrib(null)}>
      <h3 style={{fontSize:17,fontWeight:800,margin:"0 0 8px",color:"#1e293b"}}>✏️ Editar Aporte</h3>
      <div style={{display:"flex",gap:8}}>
        <input style={inp} type="number" placeholder="Monto $" value={editContrib.amount} onChange={e=>setEditContrib(p=>({...p,amount:e.target.value}))}/>
        <input style={{...inp,width:130}} type="date" value={editContrib.date} onChange={e=>setEditContrib(p=>({...p,date:e.target.value}))}/>
      </div>
      <Toggle v={editContrib.who} onChange={v=>setEditContrib(p=>({...p,who:v}))} opts={[{v:"fede",l:"🧔 Fede"},{v:"gaby",l:"👩 Gaby"}]}/>
      <div style={{display:"flex",gap:8}}>
        <button style={btnP} onClick={()=>{
          const n=Number(editContrib.amount);
          if(!n||n<=0){alert("Monto inválido");return;}
          updContribs(contribs.map(c=>c.id===editContrib.id?{...editContrib,amount:n}:c));
          setEditContrib(null);
        }}>Guardar</button>
        <button style={btnS} onClick={()=>setEditContrib(null)}>Cancelar</button>
      </div>
    </Modal>}
    {adjOpen&&<Modal onClose={()=>setAdjOpen(false)}>
      <h3 style={{fontSize:17,fontWeight:800,margin:"0 0 8px",color:"#1e293b"}}>⚡ A.D.R. — Ajuste de saldo</h3>
      <div style={{background:"#fef3c7",borderRadius:10,padding:"10px 12px",fontSize:13,color:"#92400e"}}>
        Saldo en la app: <strong>{fmt(potBal)}</strong><br/>Ingresá el saldo real del pozo
      </div>
      <input style={inp} type="number" placeholder="Saldo real $" value={adjReal} onChange={e=>setAdjReal(e.target.value)}/>
      {adjReal&&<div style={{fontSize:13,color:"#6b7280"}}>Diferencia: <strong style={{color:Number(adjReal)>=potBal?"#22c55e":"#ef4444"}}>{fmt(Number(adjReal)-potBal)}</strong></div>}
      <textarea style={{...inp,height:68,resize:"none"}} placeholder="Motivo del ajuste *" value={adjReason} onChange={e=>setAdjReason(e.target.value)}/>
      <div style={{display:"flex",gap:8}}>
        <button style={btnP} onClick={doAdj}>Aplicar A.D.R.</button>
        <button style={btnS} onClick={()=>setAdjOpen(false)}>Cancelar</button>
      </div>
    </Modal>}
  </div>;
}

// ── PRÉSTAMOS ────────────────────────────────────────────────────────────────
function PrestamosTab({user,loans,updLoans}){
  const [open,setOpen]=useState(false);
  const [selMode,setSelMode]=useState(false);
  const [selSet,setSelSet]=useState(new Set());
  const [confirmAll,setConfirmAll]=useState(false);
  const [editLoan,setEditLoan]=useState(null);
  const blank={from:user,to:user==="fede"?"gaby":"fede",amount:"",description:"",date:today()};
  const [form,setForm]=useState(blank);

  const add=()=>{
    if(!form.amount||!form.description.trim())return;
    updLoans([...loans,{...form,id:Date.now(),amount:Number(form.amount)}]);
    setForm(blank); setOpen(false);
  };
  const toggleSel=id=>{setSelSet(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});};
  const deleteSel=()=>{
    if(!window.confirm(`¿Borrar ${selSet.size} préstamo${selSet.size>1?"s":""}?`))return;
    updLoans(loans.filter(l=>!selSet.has(l.id)));
    setSelSet(new Set()); setSelMode(false);
  };

  const sorted=[...loans].sort((a,b)=>b.date.localeCompare(a.date));

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
      <H2>🤝 Préstamos</H2>
      <div style={{display:"flex",gap:6}}>
        <Btn onClick={()=>setOpen(o=>!o)}>+ Nuevo</Btn>
        {loans.length>0&&<>
          <button onClick={()=>{setSelMode(s=>!s);setSelSet(new Set());}} style={{fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:99,border:"1.5px solid #e2e8f0",background:selMode?"#ede9fe":"white",color:selMode?"#6366f1":"#64748b",cursor:"pointer"}}>{selMode?"Cancelar":"Selec."}</button>
          <button onClick={()=>setConfirmAll(true)} style={{fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:99,border:"1.5px solid #fee2e2",background:"#fff1f2",color:"#ef4444",cursor:"pointer"}}>🗑</button>
        </>}
      </div>
    </div>

    {open&&<Card>
      <Toggle v={form.from} onChange={v=>setForm(p=>({...p,from:v,to:v==="fede"?"gaby":"fede"}))} opts={[{v:"fede",l:"🧔 Fede prestó"},{v:"gaby",l:"👩 Gaby prestó"}]}/>
      <div style={{display:"flex",gap:8}}>
        <input style={inp} type="number" placeholder="Monto $" value={form.amount} onChange={e=>setForm(p=>({...p,amount:e.target.value}))}/>
        <input style={{...inp,width:130}} type="date" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))}/>
      </div>
      <input style={inp} placeholder="Descripción / motivo *" value={form.description} onChange={e=>setForm(p=>({...p,description:e.target.value}))}/>
      <div style={{display:"flex",gap:8}}>
        <button style={btnP} onClick={add}>Guardar</button>
        <button style={btnS} onClick={()=>setOpen(false)}>Cancelar</button>
      </div>
    </Card>}

    {selMode&&selSet.size>0&&<div style={{background:"#fef3c7",borderRadius:10,padding:"9px 13px",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <span style={{fontSize:13,color:"#92400e",fontWeight:600}}>{selSet.size} seleccionado{selSet.size>1?"s":""}</span>
      <button onClick={deleteSel} style={{background:"#ef4444",color:"white",border:"none",borderRadius:8,padding:"6px 13px",fontWeight:700,cursor:"pointer",fontSize:12}}>🗑 Borrar</button>
    </div>}

    {loans.length===0
      ?<div style={{textAlign:"center",color:"#94a3b8",padding:28,fontSize:14}}>No hay préstamos registrados</div>
      :<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {sorted.map(l=>{
          const isSel=selSet.has(l.id);
          return <div key={l.id}
            onClick={selMode?()=>toggleSel(l.id):undefined}
            style={{background:isSel?"#ede9fe":"white",borderRadius:14,padding:13,boxShadow:"0 1px 3px rgba(0,0,0,.05)",cursor:selMode?"pointer":"default",borderLeft:isSel?"3px solid #6366f1":"3px solid #f59e0b"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
              <div style={{fontSize:13,fontWeight:700,color:"#1e293b",display:"flex",alignItems:"center",gap:4}}>
                {selMode&&<span style={{fontSize:15,marginRight:4}}>{isSel?"✅":"○"}</span>}
                {l.from==="fede"?"🧔 Fede":"👩 Gaby"} <span style={{color:"#94a3b8"}}>→</span> {l.to==="fede"?"🧔 Fede":"👩 Gaby"}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{fontSize:16,fontWeight:900,color:"#f59e0b"}}>{fmt(l.amount)}</div>
                {!selMode&&<button onClick={()=>setEditLoan({...l})} style={{background:"#ede9fe",color:"#6366f1",border:"none",borderRadius:6,padding:"2px 5px",fontSize:10,cursor:"pointer",fontWeight:700}}>✏️</button>}
                {!selMode&&<button onClick={()=>{if(window.confirm("¿Borrar este préstamo?"))updLoans(loans.filter(x=>x.id!==l.id));}} style={{background:"#fee2e2",color:"#ef4444",border:"none",borderRadius:6,padding:"2px 5px",fontSize:10,cursor:"pointer",fontWeight:700}}>🗑</button>}
              </div>
            </div>
            <div style={{fontSize:13,color:"#475569"}}>{l.description}</div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{fmtD(l.date)}</div>
          </div>;
        })}
      </div>
    }

    {editLoan&&<Modal onClose={()=>setEditLoan(null)}>
      <h3 style={{fontSize:17,fontWeight:800,margin:"0 0 8px",color:"#1e293b"}}>✏️ Editar Préstamo</h3>
      <Toggle v={editLoan.from} onChange={v=>setEditLoan(p=>({...p,from:v,to:v==="fede"?"gaby":"fede"}))} opts={[{v:"fede",l:"🧔 Fede prestó"},{v:"gaby",l:"👩 Gaby prestó"}]}/>
      <div style={{display:"flex",gap:8}}>
        <input style={inp} type="number" placeholder="Monto $" value={editLoan.amount} onChange={e=>setEditLoan(p=>({...p,amount:e.target.value}))}/>
        <input style={{...inp,width:130}} type="date" value={editLoan.date} onChange={e=>setEditLoan(p=>({...p,date:e.target.value}))}/>
      </div>
      <input style={inp} placeholder="Descripción" value={editLoan.description} onChange={e=>setEditLoan(p=>({...p,description:e.target.value}))}/>
      <div style={{display:"flex",gap:8}}>
        <button style={btnP} onClick={()=>{
          const n=Number(editLoan.amount);
          if(!n||!editLoan.description.trim()){alert("Completá todos los campos");return;}
          updLoans(loans.map(l=>l.id===editLoan.id?{...editLoan,amount:n}:l));
          setEditLoan(null);
        }}>Guardar</button>
        <button style={btnS} onClick={()=>setEditLoan(null)}>Cancelar</button>
      </div>
    </Modal>}
    {confirmAll&&<Modal onClose={()=>setConfirmAll(false)}>
      <h3 style={{fontSize:17,fontWeight:800,margin:"0 0 8px",color:"#1e293b"}}>🗑 Borrar todos los préstamos</h3>
      <div style={{background:"#fee2e2",borderRadius:10,padding:"10px 13px",fontSize:13,color:"#b91c1c"}}>
        Esto borra <strong>todos los {loans.length} préstamos</strong> permanentemente.
      </div>
      <div style={{display:"flex",gap:8,marginTop:4}}>
        <button style={{...btnP,background:"#ef4444"}} onClick={()=>{updLoans([]);setConfirmAll(false);setSelMode(false);setSelSet(new Set());}}>Sí, borrar todo</button>
        <button style={btnS} onClick={()=>setConfirmAll(false)}>Cancelar</button>
      </div>
    </Modal>}
  </div>;
}

// ── RESUMEN ──────────────────────────────────────────────────────────────────
function ResumenTab({txs,contribs,loans,adjs,net,g2f,f2g,potBalance}){
  const [period,setPeriod]=useState("6m");
  const [chart,setChart]=useState("categoria");
  const [csvOpen,setCsvOpen]=useState(false);

  const months=period==="3m"?3:period==="6m"?6:period==="1y"?12:18;
  const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-months);
  const cutStr=cutoff.toISOString().split("T")[0];
  const filt=period==="all"?txs:txs.filter(t=>t.date>=cutStr);

  const byCat={};
  filt.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount;});
  const catData=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const catMax=catData[0]?.[1]||1;

  const byMonth={};
  filt.forEach(t=>{const m=t.date.slice(0,7); if(!byMonth[m])byMonth[m]={fede:0,gaby:0}; byMonth[m][t.paidBy]+=t.amount;});
  const mData=Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0]));
  const mMax=Math.max(...mData.map(([,v])=>v.fede+v.gaby),1);

  const fedePaid=filt.filter(t=>t.paidBy==="fede").reduce((a,t)=>a+t.amount,0);
  const gabyPaid=filt.filter(t=>t.paidBy==="gaby").reduce((a,t)=>a+t.amount,0);
  const total=fedePaid+gabyPaid;
  const mLabel=m=>{const[y,mo]=m.split("-");return["E","F","M","A","M","J","J","A","S","O","N","D"][+mo-1]+y.slice(2);};
  const colors=["#6366f1","#f59e0b","#22c55e","#ef4444","#8b5cf6","#ec4899","#14b8a6","#f97316","#06b6d4","#84cc16"];

  const buildCSV=()=>{
    const r=[];
    r.push("GASTOS\nFecha,Descripcion,Categoria,Pago,Tipo,Monto");
    txs.forEach(t=>r.push(`${t.date},"${(t.description||"").replace(/"/g,'""')}",${t.category},${t.paidBy},${t.type},${t.amount}`));
    r.push("\nAPORTES AL POZO\nFecha,Quien,Monto");
    contribs.forEach(c=>r.push(`${c.date},${c.who},${c.amount}`));
    r.push("\nPRESTAMOS\nFecha,De,Para,Monto,Descripcion,Estado");
    loans.forEach(l=>r.push(`${l.date},${l.from},${l.to},${l.amount},"${(l.description||"").replace(/"/g,'""')}"`));
    r.push(`\nBALANCE\nGaby debe a Fede,${g2f}\nFede debe a Gaby,${f2g}\nSaldo pozo,${potBalance}`);
    return r.join("\n");
  };

  const copyCSV=()=>{
    const txt=buildCSV();
    if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert("¡Copiado! Pegalo en Google Sheets")).catch(()=>alert("No se pudo copiar, seleccioná el texto manualmente"));}
    else{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);alert("¡Copiado!");}
  };

  return <div>
    <Row><H2>📊 Resumen</H2><Btn onClick={()=>setCsvOpen(true)} color="#16a34a">📋 Exportar</Btn></Row>
    <div style={{background:"white",borderRadius:16,padding:14,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <div style={{textAlign:"center",flex:1}}>
          <div style={{fontSize:15,fontWeight:800,color:"#1e293b"}}>🧔 Fede</div>
          <div style={{fontSize:12,color:"#ef4444",fontWeight:600,marginTop:3}}>{f2g>0?`Debe ${fmt(f2g)}`:"No debe nada"}</div>
        </div>
        <div style={{flex:1,textAlign:"center",fontSize:12,fontWeight:800,color:"#6366f1",lineHeight:1.5}}>
          {net===0?"🤝 Par":net>0?`Gaby → Fede\n${fmt(Math.abs(net))}`:`Fede → Gaby\n${fmt(Math.abs(net))}`}
        </div>
        <div style={{textAlign:"center",flex:1}}>
          <div style={{fontSize:15,fontWeight:800,color:"#1e293b"}}>👩 Gaby</div>
          <div style={{fontSize:12,color:"#ef4444",fontWeight:600,marginTop:3}}>{g2f>0?`Debe ${fmt(g2f)}`:"No debe nada"}</div>
        </div>
      </div>
      <div style={{textAlign:"center",fontSize:12,color:"#64748b",paddingTop:8,borderTop:"1px solid #f1f5f9"}}>🪣 Pozo: <strong>{fmt(potBalance)}</strong></div>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
      {[["3m","3m"],["6m","6m"],["1y","1 año"],["all","Todo"]].map(([v,l])=>(
        <button key={v} onClick={()=>setPeriod(v)} style={{...chip,...(period===v?chipA:{})}}>{l}</button>
      ))}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
      <div style={{background:"white",borderRadius:13,padding:12,textAlign:"center",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
        <div style={{fontSize:11,color:"#94a3b8",marginBottom:3}}>Fede pagó</div>
        <div style={{fontSize:18,fontWeight:900,color:"#1e293b"}}>{fmt(fedePaid)}</div>
        <div style={{fontSize:12,color:"#6366f1",fontWeight:700}}>{total>0?Math.round(fedePaid/total*100):0}%</div>
      </div>
      <div style={{background:"white",borderRadius:13,padding:12,textAlign:"center",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
        <div style={{fontSize:11,color:"#94a3b8",marginBottom:3}}>Gaby pagó</div>
        <div style={{fontSize:18,fontWeight:900,color:"#1e293b"}}>{fmt(gabyPaid)}</div>
        <div style={{fontSize:12,color:"#ec4899",fontWeight:700}}>{total>0?Math.round(gabyPaid/total*100):0}%</div>
      </div>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
      {[["categoria","Por categoría"],["mes","Por mes"],["quien","Por persona"]].map(([v,l])=>(
        <button key={v} onClick={()=>setChart(v)} style={{...chip,...(chart===v?chipA:{})}}>{l}</button>
      ))}
    </div>
    <div style={{background:"white",borderRadius:16,padding:14,boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:20}}>
      {chart==="categoria"&&<>
        <div style={{fontSize:14,fontWeight:700,color:"#475569",marginBottom:12}}>Gastos por categoría</div>
        {catData.map(([cat,tot],i)=>(
          <div key={cat} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
            <div style={{fontSize:12,color:"#64748b",width:110,flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cat}</div>
            <div style={{flex:1,background:"#f1f5f9",borderRadius:99,height:12,overflow:"hidden"}}>
              <div style={{width:`${(tot/catMax)*100}%`,height:"100%",borderRadius:99,background:colors[i%colors.length]}}/>
            </div>
            <div style={{fontSize:11,fontWeight:700,color:"#1e293b",width:88,textAlign:"right",flexShrink:0}}>{fmt(tot)}</div>
          </div>
        ))}
      </>}
      {chart==="mes"&&<>
        <div style={{fontSize:14,fontWeight:700,color:"#475569",marginBottom:12}}>Gastos por mes</div>
        <div style={{display:"flex",gap:3,alignItems:"flex-end",overflowX:"auto",padding:"4px 0 8px"}}>
          {mData.map(([m,v])=>(
            <div key={m} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:28}}>
              <div style={{display:"flex",alignItems:"flex-end",height:90,gap:2}}>
                <div style={{width:10,borderRadius:"3px 3px 0 0",background:"#6366f1",height:`${Math.round((v.fede/mMax)*90)}px`,minHeight:2}}/>
                <div style={{width:10,borderRadius:"3px 3px 0 0",background:"#ec4899",height:`${Math.round((v.gaby/mMax)*90)}px`,minHeight:2}}/>
              </div>
              <div style={{fontSize:8,color:"#94a3b8",marginTop:3}}>{mLabel(m)}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:12,justifyContent:"center",fontSize:11,color:"#64748b",marginTop:4}}>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"#6366f1",marginRight:3}}/>Fede</span>
          <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"#ec4899",marginRight:3}}/>Gaby</span>
        </div>
      </>}
      {chart==="quien"&&total>0&&(()=>{
        const fa=(fedePaid/total)*360;
        const r=70,cx=100,cy=85;
        const rad=deg=>(deg-90)*Math.PI/180;
        const x1=cx+r*Math.cos(rad(0)),y1=cy+r*Math.sin(rad(0));
        const x2=cx+r*Math.cos(rad(fa)),y2=cy+r*Math.sin(rad(fa));
        return <>
          <div style={{fontSize:14,fontWeight:700,color:"#475569",marginBottom:12}}>Distribución de gastos</div>
          <div style={{display:"flex",justifyContent:"center"}}>
            <svg width="200" height="170">
              <path d={`M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${fa>180?1:0},1 ${x2},${y2} Z`} fill="#6366f1"/>
              <path d={`M${cx},${cy} L${x2},${y2} A${r},${r} 0 ${fa>180?0:1},1 ${x1},${y1} Z`} fill="#ec4899"/>
              <circle cx={cx} cy={cy} r={34} fill="white"/>
              <text x={cx} y={cy-4} textAnchor="middle" fontSize="10" fill="#374151">Total</text>
              <text x={cx} y={cy+10} textAnchor="middle" fontSize="9" fill="#374151">{fmt(total)}</text>
              <text x={cx-42} y={cy-18} textAnchor="middle" fontSize="11" fill="white" fontWeight="bold">{Math.round(fedePaid/total*100)}%</text>
              <text x={cx+42} y={cy+26} textAnchor="middle" fontSize="11" fill="white" fontWeight="bold">{Math.round(gabyPaid/total*100)}%</text>
            </svg>
          </div>
          <div style={{display:"flex",gap:16,justifyContent:"center",fontSize:12,color:"#64748b",marginTop:4}}>
            <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"#6366f1",marginRight:3}}/>Fede {fmt(fedePaid)}</span>
            <span><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:"#ec4899",marginRight:3}}/>Gaby {fmt(gabyPaid)}</span>
          </div>
        </>;
      })()}
    </div>
    {csvOpen&&<Modal onClose={()=>setCsvOpen(false)}>
      <h3 style={{fontSize:17,fontWeight:800,margin:"0 0 6px",color:"#1e293b"}}>📋 Exportar datos</h3>
      <p style={{fontSize:13,color:"#64748b",margin:"0 0 8px"}}>Tocá "Copiar" y pegá en Google Sheets (Archivo → Importar → Pegar).</p>
      <textarea readOnly value={buildCSV()} onFocus={e=>e.target.select()} style={{width:"100%",height:180,fontSize:10,fontFamily:"monospace",border:"1.5px solid #e2e8f0",borderRadius:10,padding:10,resize:"none",color:"#374151",background:"#f8fafc"}}/>
      <button style={{...btnP,marginTop:4}} onClick={copyCSV}>📋 Copiar al portapapeles</button>
    </Modal>}
  </div>;
}

// ── HISTORIAL ────────────────────────────────────────────────────────────────
function HistorialTab({hist, updHist}){
  const [selected, setSelected] = useState(new Set());
  const [confirmAll, setConfirmAll] = useState(false);
  const [selectMode, setSelectMode] = useState(false);

  const sorted = [...hist].sort((a,b)=>b.date.localeCompare(a.date));

  const toggleSelect = (id) => {
    setSelected(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const deleteSelected = () => {
    if(selected.size===0) return;
    if(!window.confirm(`¿Borrar ${selected.size} entrada${selected.size>1?"s":""}?`)) return;
    updHist(hist.filter(e => !selected.has(e.id)));
    setSelected(new Set());
    setSelectMode(false);
  };

  const deleteAll = () => {
    updHist([]);
    setConfirmAll(false);
    setSelectMode(false);
    setSelected(new Set());
  };

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
      <H2>📜 Historial A.D.R.</H2>
      {hist.length>0 && <div style={{display:"flex",gap:6}}>
        <button onClick={()=>{setSelectMode(s=>!s); setSelected(new Set());}}
          style={{fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:99,border:"1.5px solid #e2e8f0",background:selectMode?"#ede9fe":"white",color:selectMode?"#6366f1":"#64748b",cursor:"pointer"}}>
          {selectMode?"Cancelar":"Seleccionar"}
        </button>
        <button onClick={()=>setConfirmAll(true)}
          style={{fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:99,border:"1.5px solid #fee2e2",background:"#fff1f2",color:"#ef4444",cursor:"pointer"}}>
          🗑 Todo
        </button>
      </div>}
    </div>

    {selectMode && selected.size>0 &&
      <div style={{background:"#fef3c7",borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:13,color:"#92400e",fontWeight:600}}>{selected.size} seleccionada{selected.size>1?"s":""}</span>
        <button onClick={deleteSelected} style={{background:"#ef4444",color:"white",border:"none",borderRadius:8,padding:"7px 14px",fontWeight:700,cursor:"pointer",fontSize:13}}>
          🗑 Borrar selección
        </button>
      </div>
    }

    {hist.length===0
      ?<div style={{textAlign:"center",color:"#94a3b8",padding:32,fontSize:14}}>No hay ajustes registrados aún</div>
      :<div style={{display:"flex",flexDirection:"column",gap:8}}>
        {sorted.map(e=>{
          const isSel = selected.has(e.id);
          return <div key={e.id}
            onClick={selectMode ? ()=>toggleSelect(e.id) : undefined}
            style={{background:isSel?"#ede9fe":"#fefce8",borderRadius:12,padding:"11px 13px",borderLeft:`4px solid ${isSel?"#6366f1":"#f59e0b"}`,cursor:selectMode?"pointer":"default",transition:"background .15s"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div style={{flex:1}}>
                {selectMode && <div style={{fontSize:11,color:isSel?"#6366f1":"#94a3b8",fontWeight:700,marginBottom:4}}>{isSel?"✅ Seleccionado":"○ Tocar para seleccionar"}</div>}
                <div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>⚡ {e.label} — {e.desc}</div>
                <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{fmtD(e.date)} · por {e.who==="fede"?"🧔 Fede":"👩 Gaby"}</div>
                <div style={{fontSize:12,color:"#92400e",marginTop:3}}>Motivo: {e.reason}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                <div style={{fontSize:12,color:"#6b7280",textAlign:"right"}}>
                  <div>Antes: {fmt(e.oldVal)}</div><div>Después: {fmt(e.newVal)}</div>
                </div>
                {!selectMode &&
                  <button onClick={()=>{ if(window.confirm("¿Borrar este ajuste?")) updHist(hist.filter(x=>x.id!==e.id)); }}
                    style={{background:"#fee2e2",color:"#ef4444",border:"none",borderRadius:6,padding:"2px 5px",fontSize:10,fontWeight:700,cursor:"pointer"}}>
                    🗑
                  </button>
                }
              </div>
            </div>
          </div>;
        })}
      </div>
    }

    {confirmAll && <Modal onClose={()=>setConfirmAll(false)}>
      <h3 style={{fontSize:17,fontWeight:800,margin:"0 0 8px",color:"#1e293b"}}>🗑 Borrar todo el historial</h3>
      <div style={{background:"#fee2e2",borderRadius:10,padding:"10px 13px",fontSize:13,color:"#b91c1c",marginBottom:8}}>
        Esto borra <strong>todos los {hist.length} registros</strong> del historial A.D.R. permanentemente. No se puede deshacer.
      </div>
      <div style={{display:"flex",gap:8}}>
        <button style={{...btnP,background:"#ef4444"}} onClick={deleteAll}>Sí, borrar todo</button>
        <button style={btnS} onClick={()=>setConfirmAll(false)}>Cancelar</button>
      </div>
    </Modal>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
