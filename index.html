    {id:13,date:"2025-05-01",who:"gaby",amount:55000},{id:14,date:"2025-06-15",who:"fede",amount:70000},
    {id:15,date:"2025-07-01",who:"gaby",amount:65000},{id:16,date:"2025-08-01",who:"fede",amount:80000},
    {id:17,date:"2025-08-01",who:"gaby",amount:80000},{id:18,date:"2025-09-10",who:"fede",amount:90000},
    {id:19,date:"2025-10-01",who:"gaby",amount:85000},{id:20,date:"2025-11-01",who:"fede",amount:100000},
    {id:21,date:"2025-11-01",who:"gaby",amount:100000},{id:22,date:"2026-01-05",who:"fede",amount:120000},
    {id:23,date:"2026-01-05",who:"gaby",amount:110000},{id:24,date:"2026-03-01",who:"fede",amount:130000},

    {id:1,date:"2024-12-20",from:"fede",to:"gaby",amount:15000,description:"Regalo mamá"},
    {id:2,date:"2025-02-14",from:"gaby",to:"fede",amount:8000,description:"Farmacia emergencia"},
    {id:3,date:"2025-04-05",from:"fede",to:"gaby",amount:22000,description:"Ropa temporada"},
    {id:4,date:"2025-07-10",from:"gaby",to:"fede",amount:35000,description:"Viaje Mendoza"},

// ── HELPERS ──────────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);
const fmtD = s => new Date(s+"T12:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"});
const today = () => new Date().toISOString().split("T")[0];
const inp = {border:"1.5px solid #e2e8f0",borderRadius:10,padding:"10px 11px",fontSize:14,outline:"none",background:"#f8fafc",width:"100%",boxSizing:"border-box"};
const sel = {border:"1.5px solid #e2e8f0",borderRadius:10,padding:"10px 11px",fontSize:14,background:"#f8fafc",width:"100%",boxSizing:"border-box"};
const chip = {padding:"6px 13px",borderRadius:99,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer",fontSize:12,fontWeight:600,color:"#64748b"};
const chipA = {background:"#6366f1",color:"white",border:"1.5px solid #6366f1"};
const btnP = {background:"#6366f1",color:"white",border:"none",borderRadius:10,padding:12,fontWeight:700,cursor:"pointer",fontSize:14,flex:1};
const btnS = {background:"#f1f5f9",color:"#64748b",border:"none",borderRadius:10,padding:12,fontWeight:700,cursor:"pointer",fontSize:14,flex:1};

function Row({children}){return <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>{children}</div>;}
function H2({children}){return <h2 style={{fontSize:19,fontWeight:800,color:"#1e293b",margin:0}}>{children}</h2>;}
function Card({children}){return <div style={{background:"white",borderRadius:16,padding:14,marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,.07)",display:"flex",flexDirection:"column",gap:9}}>{children}</div>;}
function Btn({children,onClick,color}){return <button onClick={onClick} style={{background:color||"#6366f1",color:"white",border:"none",borderRadius:99,padding:"8px 16px",fontWeight:700,cursor:"pointer",fontSize:13}}>{children}</button>;}

function Toggle({v,onChange,opts}){
  return <div style={{display:"flex",gap:7}}>{opts.map(o=>(
    <button key={o.v} onClick={()=>onChange(o.v)} style={{flex:1,padding:"9px 6px",borderRadius:10,border:v===o.v?"2px solid #6366f1":"2px solid #e2e8f0",background:v===o.v?"#ede9fe":"white",color:v===o.v?"#6366f1":"#64748b",cursor:"pointer",fontSize:13,fontWeight:600}}>{o.l}</button>
  ))}</div>;
}

function Modal({children,onClose}){
  return <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"white",borderRadius:"22px 22px 0 0",padding:22,width:"100%",maxWidth:520,maxHeight:"85vh",overflowY:"auto",display:"flex",flexDirection:"column",gap:9}}>

// ── APP ROOT ─────────────────────────────────────────────────────────────────
function App(){
  const [ready, setReady] = useState(false);
  const [user,  setUser]  = useState(() => { try{return localStorage.getItem("cc_user")||null;}catch{return null;} });
  const [txs,   setTxs]   = useState([]);
  const [contribs,setContribs] = useState([]);
  const [loans, setLoans] = useState([]);
  const [adjs,  setAdjs]  = useState([]);
  const [hist,  setHist]  = useState([]);

  useEffect(()=>{
    const init = () => {
      const db = window._fbDb;
      const ref = window._fbDoc(db, "data", "shared");
      const unsub = window._fbOnSnapshot(ref, snap => {
        if(snap.exists()){
          const d = snap.data();
          setTxs(d.txs||[]);
          setContribs(d.contribs||[]);
          setLoans(d.loans||[]);
          setAdjs(d.adjs||[]);
          setHist(d.hist||[]);
        }
        setReady(true);
      }, err => { console.error(err); setReady(true); });
      return unsub;
    };
    if(window._fbReady){ const u=init(); return ()=>u&&u(); }
    const h = () => { const u=init(); window._unsub=u; };
    window.addEventListener("fbready", h);
    return () => window.removeEventListener("fbready", h);
  },[]);

  const push = async (key, val) => {
    const db = window._fbDb;
    const ref = window._fbDoc(db, "data", "shared");
    const current = { txs, contribs, loans, adjs, hist };
    await window._fbSetDoc(ref, { ...current, [key]: val }, { merge: true });
  };

  const updTxs      = v => { setTxs(v);      push("txs",v); };
  const updContribs = v => { setContribs(v);  push("contribs",v); };
  const updLoans    = v => { setLoans(v);     push("loans",v); };
  const updAdjs     = v => { setAdjs(v);      push("adjs",v); };
  const updHist     = v => { setHist(v);      push("hist",v); };

  const selectUser = u => { setUser(u); try{localStorage.setItem("cc_user",u);}catch{}  };

  if(!ready) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:12,fontFamily:"sans-serif",color:"#6366f1"}}>
    <div style={{fontSize:32}}>💸</div>
    <div style={{fontSize:16,fontWeight:700}}>Cuentas Claras</div>
    <div style={{fontSize:13,color:"#94a3b8"}}>Conectando...</div>
  </div>;

  if(!user) return <UserSelect onSelect={selectUser}/>;
  return <Main user={user} onSwitch={()=>selectUser(null)}
    txs={txs} updTxs={updTxs}
    contribs={contribs} updContribs={updContribs}
    loans={loans} updLoans={updLoans}
    adjs={adjs} updAdjs={updAdjs}
    hist={hist} updHist={updHist}
  />;
}

// ── USER SELECT ──────────────────────────────────────────────────────────────
function UserSelect({onSelect}){
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#667eea,#764ba2)"}}>
    <div style={{background:"white",borderRadius:24,padding:"40px 32px",textAlign:"center",boxShadow:"0 25px 50px rgba(0,0,0,0.25)",minWidth:300}}>
      <div style={{fontSize:28,fontWeight:800,color:"#1e293b",marginBottom:8}}>💸 Cuentas Claras</div>
      <div style={{fontSize:16,color:"#64748b",marginBottom:32}}>¿Quién sos?</div>
      <div style={{display:"flex",gap:16,justifyContent:"center"}}>
        <button onClick={()=>onSelect("fede")} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,padding:"20px 28px",borderRadius:16,border:"none",cursor:"pointer",background:"#ede9fe",color:"#6d28d9",fontSize:18,fontWeight:700}}>
          <span style={{fontSize:40}}>🧔</span>Fede
        </button>
        <button onClick={()=>onSelect("gaby")} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8,padding:"20px 28px",borderRadius:16,border:"none",cursor:"pointer",background:"#fce7f3",color:"#be185d",fontSize:18,fontWeight:700}}>
          <span style={{fontSize:40}}>👩</span>Gaby
        </button>
      </div>
      <button onClick={()=>{if(window.confirm("¿Borrar todos los datos y empezar de cero?")){"txs,contribs,loans,adjs,hist,user".split(",").forEach(k=>localStorage.removeItem("cc_"+k));window.location.reload();}}} style={{marginTop:24,background:"none",border:"1.5px solid #e2e8f0",borderRadius:99,padding:"8px 18px",fontSize:12,color:"#94a3b8",cursor:"pointer"}}>
        🔄 Resetear todos los datos
      </button>
    </div>
  </div>;
}

// ── MAIN ─────────────────────────────────────────────────────────────────────
function Main({user,onSwitch,txs,updTxs,contribs,updContribs,loans,updLoans,adjs,updAdjs,hist,updHist}){
  const [tab,setTab]=useState("gastos");

  const calcBal=()=>{
    let g2f=0,f2g=0;
    txs.filter(t=>t.type==="individual").forEach(t=>{const h=t.amount/2; if(t.paidBy==="fede")g2f+=h; else f2g+=h;});
    const fp=contribs.filter(c=>c.who==="fede").reduce((a,c)=>a+c.amount,0);
    const gp=contribs.filter(c=>c.who==="gaby").reduce((a,c)=>a+c.amount,0);
    const diff=fp-gp; if(diff>0)g2f+=diff/2; else if(diff<0)f2g+=Math.abs(diff)/2;
    loans.forEach(l=>{if(l.from==="fede")g2f+=l.amount; else f2g+=l.amount;});
    return{net:g2f-f2g,g2f,f2g};
  };
  const calcPot=()=>contribs.reduce((a,c)=>a+c.amount,0)-txs.filter(t=>t.type==="pot").reduce((a,t)=>a+t.amount,0)+adjs.reduce((a,x)=>a+x.delta,0);

  const {net,g2f,f2g}=calcBal();
  const potBalance=calcPot();
  const tabs=[{id:"gastos",icon:"💳",label:"Gastos"},{id:"pozo",icon:"🪣",label:"Pozo"},{id:"prestamos",icon:"🤝",label:"Préstamos"},{id:"resumen",icon:"📊",label:"Resumen"},{id:"historial",icon:"📜",label:"Historial"}];

  return <div style={{maxWidth:520,margin:"0 auto",minHeight:"100vh",background:"#f8fafc",paddingBottom:80}}>
    <div style={{background:"white",padding:"14px 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #f1f5f9",position:"sticky",top:0,zIndex:10,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
      <div>
        <div style={{fontSize:17,fontWeight:800,color:"#1e293b"}}>💸 Cuentas Claras</div>
        <div onClick={onSwitch} style={{fontSize:12,color:"#6366f1",cursor:"pointer",background:"#ede9fe",padding:"2px 10px",borderRadius:99,display:"inline-block",marginTop:2}}>
          {user==="fede"?"🧔 Fede":"👩 Gaby"} ↩
        </div>
      </div>
      <div style={{fontSize:11,fontWeight:700,color:"white",padding:"6px 10px",borderRadius:99,background:net===0?"#22c55e":net>0?"#f59e0b":"#6366f1",textAlign:"center",lineHeight:1.4}}>
        {net===0?"🤝 Par":net>0?`Gaby debe\n${fmt(Math.abs(net))}`:`Fede debe\n${fmt(Math.abs(net))}`}
      </div>
    </div>
    <div style={{display:"flex",background:"white",borderBottom:"1px solid #f1f5f9",position:"sticky",top:58,zIndex:9,overflowX:"auto"}}>
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"9px 4px",border:"none",background:"transparent",cursor:"pointer",fontSize:17,color:tab===t.id?"#6366f1":"#94a3b8",borderBottom:tab===t.id?"2px solid #6366f1":"2px solid transparent",minWidth:56}}>
          <span>{t.icon}</span><span style={{fontSize:9,fontWeight:700}}>{t.label}</span>
        </button>
      ))}
    </div>
    <div style={{padding:"14px 14px 0"}}>
      {tab==="gastos"    && <GastosTab    user={user} txs={txs} updTxs={updTxs} hist={hist} updHist={updHist}/>}
      {tab==="pozo"      && <PozoTab      user={user} contribs={contribs} updContribs={updContribs} txs={txs} adjs={adjs} updAdjs={updAdjs} hist={hist} updHist={updHist}/>}
      {tab==="prestamos" && <PrestamosTab user={user} loans={loans} updLoans={updLoans}/>}
      {tab==="resumen"   && <ResumenTab   txs={txs} contribs={contribs} loans={loans} adjs={adjs} net={net} g2f={g2f} f2g={f2g} potBalance={potBalance}/>}
      {tab==="historial" && <HistorialTab hist={hist} updHist={updHist}/>}
    </div>
  </div>;
}

// ── GASTOS ───────────────────────────────────────────────────────────────────
function GastosTab({user,txs,updTxs,hist,updHist}){
  const [open,setOpen]=useState(false);
  const [filter,setFilter]=useState("all");
  const [editTx,setEditTx]=useState(null);
  const [editReason,setEditReason]=useState("");
  const [selectMode,setSelectMode]=useState(false);
  const [selected,setSelected]=useState(new Set());
  const [confirmAll,setConfirmAll]=useState(false);
  const cats=["Supermercado","Restaurante","Servicios","Nafta","Farmacia","Ropa","Entretenimiento","Vacaciones","Médico","Otros"];
  const blank={description:"",amount:"",category:"Supermercado",paidBy:user,type:"pot",date:today()};
  const [form,setForm]=useState(blank);

  const add=()=>{
    if(!form.description.trim()||!form.amount)return;
    updTxs([{...form,id:Date.now(),amount:Number(form.amount),edited:false},...txs]);
    setForm(blank); setOpen(false);
  };

  const confirmEdit=()=>{
    if(!editReason.trim()){alert("Ingresá el motivo");return;}
    const old=txs.find(t=>t.id===editTx.id);
    const nextTxs=txs.map(t=>t.id===editTx.id?{...editTx,amount:Number(editTx.amount),edited:true}:t);
    const newHist={id:Date.now(),date:today(),who:user,label:"A.D.R. Gasto",desc:old.description,oldVal:old.amount,newVal:Number(editTx.amount),reason:editReason};
    updTxs(nextTxs);
    updHist([...hist,newHist]);
    setEditTx(null);
  };

  const toggleSel=id=>{
    setSelected(prev=>{const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;});
  };

  const deleteSelected=()=>{
    if(!window.confirm(`¿Borrar ${selected.size} gasto${selected.size>1?"s":""}?`))return;
    updTxs(txs.filter(t=>!selected.has(t.id)));
    setSelected(new Set()); setSelectMode(false);
  };

  const deleteAll=()=>{
    updTxs([]); setConfirmAll(false); setSelectMode(false); setSelected(new Set());
  };

  const shown=txs.filter(t=>filter==="all"||t.paidBy===filter).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);

  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
      <H2>Gastos</H2>
      <div style={{display:"flex",gap:6}}>
        <Btn onClick={()=>setOpen(o=>!o)}>+ Nuevo</Btn>
        {txs.length>0&&<>
          <button onClick={()=>{setSelectMode(s=>!s);setSelected(new Set());}} style={{fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:99,border:"1.5px solid #e2e8f0",background:selectMode?"#ede9fe":"white",color:selectMode?"#6366f1":"#64748b",cursor:"pointer"}}>
            {selectMode?"Cancelar":"Selec."}
          </button>
          <button onClick={()=>setConfirmAll(true)} style={{fontSize:12,fontWeight:700,padding:"7px 12px",borderRadius:99,border:"1.5px solid #fee2e2",background:"#fff1f2",color:"#ef4444",cursor:"pointer"}}>🗑</button>
        </>}
      </div>
    </div>

    {open&&<Card>
      <input style={inp} placeholder="Descripción *" value={form.description} onChange={e=>setForm(p=>({...p,description:e.target.value}))}/>
      <div style={{display:"flex",gap:8}}>
        <input
